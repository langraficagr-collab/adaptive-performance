name: Android Lint - Adaptive Performance

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'liteapp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-lint.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-lint:
    name: Analyze Adaptive Performance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # Ubuntu runners include a preinstalled Android SDK and sdkmanager.
      # setup-android@v3 tried installing the removed "tools" package.
      - name: Install Android platform and build tools
        run: |
          # The hosted runner includes Android command-line tools, but its
          # sdkmanager may not be present in PATH.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -d "$SDK_ROOT/platforms/android-35" ] && [ -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Android SDK packages already installed; skipping network access."
            exit 0
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;36.0.0"

      - name: Adapt Termux-only build settings for CI
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          # The nativeapp prototype is not committed to this repository.
          sed -i '/include(.*:nativeapp.*)/s/, *":nativeapp"//' settings.gradle.kts

      - name: Run Android Lint (full and conservative editions)
        run: gradle --no-daemon --stacktrace :app:lintFullDebug :app:lintConservativeDebug

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            app/build/intermediates/lint_intermediate_text_report/**/*
          if-no-files-found: warn
